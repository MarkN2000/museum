<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum AR Prototype</title>
    <!-- Use the latest version of model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            height: 100%;
            background-color: #f0f0f0;
        }
        #ar-container {
            width: 100%;
            height: 60vh;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #controls {
            padding: 20px;
            background: white;
            height: 40vh;
            box-sizing: border-box;
            overflow-y: auto;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .note {
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="ar-container">
        <!-- 
            model-viewer setup:
            - src: Base model (Placeholder Box scaled to look like a plane)
            - ar: Enable AR
            - ar-placement="wall": Prioritize vertical placement
            - ar-modes: "webxr scene-viewer quick-look" (Order matters)
        -->
        <model-viewer 
            id="artwork-viewer"
            src="assets/plane.gltf" 
            ar 
            ar-placement="wall"
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            shadow-intensity="1"
            scale="0.5 0.5 1"> <!-- Initial scale -->
        </model-viewer>
    </div>

    <div id="controls">
        <h3>AR Artwork Settings</h3>
        
        <label for="img-url">Image URL</label>
        <input type="text" id="img-url" value="https://0.api.artsmia.org/800/62742.jpg" placeholder="https://...">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="width-cm">Width (cm)</label>
                <input type="number" id="width-cm" value="50">
            </div>
            <div style="flex: 1;">
                <label for="height-cm">Height (cm)</label>
                <input type="number" id="height-cm" value="50">
            </div>
        </div>

        <button id="update-btn">Apply & View</button>
        <button id="ar-btn" style="background-color: #007bff; color: white;">Activate AR (Manual)</button>

        <p class="note">
            Note: On iOS, this will generate a USDZ. Texture updates might take a moment.
            Wall placement requires scanning a vertical surface.
        </p>
    </div>

    <script>
        const viewer = document.querySelector('#artwork-viewer');
        const imgUrlInput = document.querySelector('#img-url');
        const widthInput = document.querySelector('#width-cm');
        const heightInput = document.querySelector('#height-cm');
        const updateBtn = document.querySelector('#update-btn');
        const arBtn = document.querySelector('#ar-btn');

        // Function to update the 3D model texture and scale
        async function updateArtwork() {
            const url = imgUrlInput.value;
            const widthCm = parseFloat(widthInput.value);
            const heightCm = parseFloat(heightInput.value);

            if (!url || isNaN(widthCm) || isNaN(heightCm)) {
                alert("Please enter valid URL and dimensions.");
                return;
            }

            try {
                // 1. Update Texture
                // Create a texture from the image URL
                console.log(`Attempting to load texture from: ${url}`);
                const texture = await viewer.createTexture(url);
                console.log("Texture created successfully", texture);
                
                // Apply to the base color of the material
                if (viewer.model && viewer.model.materials && viewer.model.materials.length > 0) {
                    const material = viewer.model.materials[0];
                    
                    // Set the base color texture
                    material.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
                    
                    // Reset metallic/roughness for better image visibility
                    material.pbrMetallicRoughness.setRoughnessFactor(1);
                    material.pbrMetallicRoughness.setMetallicFactor(0);
                    
                    // Reset baseColorFactor to white (fix for red tint)
                    material.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]);
                    
                    console.log("Texture applied to material[0]");
                } else {
                    console.error("No materials found on the model.");
                    alert("Error: Model has no materials.");
                }

                // 2. Update Scale
                const wM = widthCm / 100;
                const hM = heightCm / 100;
                const thickness = 0.02; // 2cm thickness
                
                viewer.scale = `${wM} ${hM} ${thickness}`;
                console.log(`Updated: Scale(${wM}, ${hM}, ${thickness})`);

            } catch (error) {
                console.error("Error loading texture:", error);
                alert(`Error loading texture: ${error.message}. Check console for details (CORS?).`);
            }
        }

        updateBtn.addEventListener('click', updateArtwork);

        // Wait for model to load before first update
        viewer.addEventListener('load', () => {
            console.log("Model loaded");
            updateArtwork(); // Apply initial values
        });

        arBtn.addEventListener('click', () => {
            viewer.activateAR();
        });

    </script>
</body>
</html>

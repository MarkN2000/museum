<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>壁に配置 - Museum AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        
        /* Hide A-Frame's default VR button */
        .a-enter-vr { display: none !important; }
        
        /* Header - fixed at top */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            z-index: 10000;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            margin-right: 12px;
        }
        
        .title { font-size: 1rem; }
        .size { font-size: 0.8rem; color: #aaa; margin-top: 2px; }
        
        /* Start screen */
        .start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            z-index: 9999;
        }
        
        .start-btn {
            padding: 18px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        
        .start-info {
            margin-top: 16px;
            color: #888;
            font-size: 0.9rem;
            text-align: center;
        }
        
        /* Status bar during AR */
        .status-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            z-index: 10000;
            display: none;
        }
        
        /* A-Frame scene */
        .a-scene { display: block; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div>
            <div class="title" id="title">作品名</div>
            <div class="size" id="size">サイズ: -- x -- cm</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="start-screen" id="start-screen">
        <button class="start-btn" id="start-btn">🧱 壁に配置AR開始</button>
        <p class="start-info">カメラへのアクセスを許可してください</p>
    </div>
    
    <!-- Status bar (shown during AR) -->
    <div class="status-bar" id="status">📍 面をタップして配置</div>

    <!-- A-Frame AR Scene -->
    <a-scene
        id="aframe-scene"
        webxr="requiredFeatures: local-floor; optionalFeatures: hit-test"
        ar-hit-test="target: #artwork"
        renderer="alpha: true; antialias: true"
        embedded
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="artwork-glb"></a-asset-item>
        </a-assets>
        
        <a-entity 
            id="artwork" 
            gltf-model="#artwork-glb"
            visible="false">
        </a-entity>
        
    </a-scene>

    <script>
        // URL params
        const params = new URLSearchParams(location.search);
        const glbPath = params.get('glb');
        const title = params.get('title') || '作品';
        const width = params.get('width') || '30';
        const height = params.get('height') || '40';
        
        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('size').textContent = `サイズ: ${width} x ${height} cm`;
        
        // Load GLB
        if (glbPath) {
            document.getElementById('artwork-glb').setAttribute('src', glbPath);
        }
        
        // Elements
        const scene = document.getElementById('aframe-scene');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const status = document.getElementById('status');
        const artwork = document.getElementById('artwork');
        
        // Start AR using WebXR API directly
        startBtn.addEventListener('click', async () => {
            startBtn.textContent = '起動中...';
            startBtn.disabled = true;
            
            try {
                // Check AR support
                if (!navigator.xr) {
                    throw new Error('WebXR not supported');
                }
                
                const isArSupported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!isArSupported) {
                    throw new Error('immersive-ar not supported');
                }
                
                // Request AR session with camera passthrough
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['hit-test', 'dom-overlay'],
                    domOverlay: { root: document.body }
                });
                
                // Let A-Frame handle the session
                scene.xrSession = session;
                scene.renderer.xr.setSession(session);
                
                // Hide start screen
                startScreen.style.display = 'none';
                status.style.display = 'block';
                
                console.log('AR session started');
                
                session.addEventListener('end', () => {
                    console.log('AR session ended');
                    history.back();
                });
                
            } catch (e) {
                console.error('AR start failed:', e);
                startBtn.textContent = `AR起動失敗: ${e.message}`;
                startBtn.disabled = false;
            }
        });
        
        // AR started
        scene.addEventListener('enter-vr', () => {
            console.log('AR started');
            startScreen.style.display = 'none';
            status.style.display = 'block';
        });
        
        // AR ended
        scene.addEventListener('exit-vr', () => {
            console.log('AR ended');
            history.back();
        });
        
        // Hit test events
        scene.addEventListener('ar-hit-test-achieved', () => {
            status.textContent = '🎯 面を検出！タップで配置';
        });
        
        scene.addEventListener('ar-hit-test-select', () => {
            artwork.setAttribute('visible', true);
            status.textContent = '✅ 配置完了！';
        });
    </script>
</body>
</html>
